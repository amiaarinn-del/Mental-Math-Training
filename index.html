<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rimath — Space Math Workspace</title>
    <!-- Google Fonts: Outfit (Heading/Numbers) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.jpg" type="image/jpg">
</head>

<body>
    <!-- Efek Cahaya Angkasa Latar Belakang (Kosmetik CSS) -->
    <div class="space-ambient-1"></div>
    <div class="space-ambient-2"></div>

    <div class="card">
        <!-- 1. LAYAR MENU UTAMA -->
        <div id="screen-menu" class="screen active">
            <div class="brand-badge">MENTAL MATH ENGINE</div>
            <h1>Hitung Cepat</h1>
            <p class="subtitle">Berlatih Kemampuan Mental Math</p>

            <div class="button-group">
                <button class="btn btn-primary" onclick="mulaiGame()">
                    <span>Start Session</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </button>
                <button class="btn btn-secondary" onclick="bukaSetting()">
                    <span>Setting Game</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 2. LAYAR SETTING -->
        <div id="screen-setting" class="screen">
            <div class="brand-badge">KONFIGURASI</div>
            <h2>Setting Game</h2>

            <div class="form-group">
                <label>1. Pilih Operator:</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" value="+" class="op-check">
                        <span>+</span></label>
                    <label class="checkbox-item"><input type="checkbox" value="-" class="op-check">
                        <span>-</span></label>
                    <label class="checkbox-item"><input type="checkbox" value="*" class="op-check">
                        <span>×</span></label>
                    <label class="checkbox-item"><input type="checkbox" value="/" class="op-check">
                        <span>÷</span></label>
                </div>
            </div>

            <div class="form-group">
                <label for="panjang-soal">2. Panjang Soal (Minimal 2):</label>
                <input type="number" id="panjang-soal" min="2" placeholder="Contoh: 2 atau 3">
            </div>

            <div class="form-group">
                <label for="difficulty">3. Difficulty (Tingkat Kesulitan):</label>
                <select id="difficulty">
                    <option value="">-- Pilih Difficulty --</option>
                    <option value="1">Easy (Angka 1 ~ 100)</option>
                    <option value="2">Hard (Angka 100 ~ 1,000)</option>
                    <option value="3">Extreme (Angka 10,000 ~ 100,000)</option>
                </select>
            </div>

            <!-- OPSI TOTAL WAKTU GAME -->
            <div class="form-group">
                <label for="durasi-timer">4. Total Waktu Game (Detik):</label>
                <input type="number" id="durasi-timer" min="10" max="300" placeholder="Default: 60 detik">

                <!-- FITUR BARU: ENDLESS MODE -->
                <label class="checkbox-item endless-wrapper">
                    <input type="checkbox" id="endless-mode" onchange="toggleEndlessMode()">
                    <span>Endless Mode (Tanpa Batas Waktu)</span>
                </label>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="simpanSetting()">Simpan & Kembali</button>
                <button class="btn btn-danger" onclick="resetSetting()">Reset Setting</button>
            </div>
        </div>

        <!-- 3. LAYAR GAMEPLAY -->
        <div id="screen-game" class="screen">
            <!-- HEADER GAMEPLAY (Posisikan timer di atas kotak soal) -->
            <div class="game-header">
                <span class="game-indicator">Semangat!❤️</span>
                <!-- FITUR BARU: STREAK / COMBO -->
                <div id="streak-box" class="streak-box">
                    <span class="streak-icon">🔥</span>
                    <span id="streak-display" class="streak-number">0</span>
                    <span class="streak-label">STREAK</span>
                </div>

                <div id="timer-box" class="timer-box">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <span><span id="timer-display">10</span>s</span>
                </div>
            </div>

            <div class="problem-box pop-anim" id="display-soal">0 + 0</div>

            <form id="game-form" onsubmit="submitJawaban(event)" autocomplete="off">
                <div class="form-group">
                    <input type="number" step="any" id="user-jawab" placeholder="Ketik jawaban kamu..." autofocus
                        required>
                </div>
                <button type="submit" class="btn btn-primary">Submit Jawaban</button>
            </form>

            <button class="btn btn-danger btn-outline" onclick="selesaiGame()">Quit Session</button>

            <div id="feedback" class="feedback"></div>
        </div>

        <!-- 4. LAYAR STATISTIK / SKOR -->
        <div id="screen-stat" class="screen">
            <div class="brand-badge">STATISTICS REPORT</div>
            <h2>Hasil Latihan</h2>
            <div class="stat-box">
                <div class="stat-item">
                    <span>Jumlah Benar</span>
                    <strong id="stat-benar" class="text-success">0</strong>
                </div>
                <div class="stat-item">
                    <span>Jumlah Salah</span>
                    <strong id="stat-salah" class="text-danger">0</strong>
                </div>
                <div class="stat-item">
                    <span>Total Soal Dijawab</span>
                    <strong id="stat-total">0</strong>
                </div>
                <!-- FITUR BARU: RATA-RATA WAKTU -->
                <div class="stat-item">
                    <span>Rata-rata Waktu</span>
                    <strong id="stat-rata-waktu">0s / soal</strong>
                </div>
                <!-- FITUR BARU: MAX STREAK -->
                <div class="stat-item">
                    <span>Max Streak</span>
                    <strong id="stat-max-streak" class="text-streak">🔥 0</strong>
                </div>
            </div>
            <button class="btn btn-primary" onclick="tampilkanScreen('screen-menu')">Kembali ke Menu Utama</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
